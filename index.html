<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voiceover Recorder — Startup Survival Ep. 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F5F1; --surface: #FFFFFF; --ink: #121212; --muted: #6B6862; --line: #DDD9D0;
  --gold: #8F6F12; --gold-soft: #EADFC0; --rec: #C4362F; --spoken: #121212; --unspoken: #A8A49B;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #050505; --surface: #121212; --ink: #FFFFFF; --muted: #9A968C; --line: #2A2A2A;
    --gold: #D4AF37; --gold-soft: #3A3115; --rec: #E5484D; --spoken: #FFFFFF; --unspoken: #5E5B55;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #050505; --surface: #121212; --ink: #FFFFFF; --muted: #9A968C; --line: #2A2A2A;
  --gold: #D4AF37; --gold-soft: #3A3115; --rec: #E5484D; --spoken: #FFFFFF; --unspoken: #5E5B55;
  color-scheme: dark;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.app { max-width: 640px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding: 18px 18px 0; }

header.clock { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.time { font-family: "Oswald", "Arial Narrow", sans-serif; font-weight: 700; font-size: clamp(56px, 18vw, 92px); line-height: 1; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.time small { font-size: .38em; color: var(--muted); font-weight: 500; margin-left: 6px; }
.state { font-size: 15px; font-weight: 600; color: var(--muted); text-align: right; }
.state.rec { color: var(--rec); }
.state.rec::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--rec); margin-right: 8px; vertical-align: 1px; }

.track { position: relative; display: flex; gap: 3px; margin: 16px 0 6px; height: 34px; }
.seg { position: relative; flex-grow: var(--d); border-radius: 6px; background: var(--line); overflow: hidden; }
.seg i { position: absolute; inset: 0; background: var(--gold); transform-origin: 0 50%; transform: scaleX(0); }
.seg b { position: absolute; left: 7px; top: 50%; transform: translateY(-50%); font-family: "Oswald", sans-serif; font-weight: 500; font-size: 13px; color: var(--muted); mix-blend-mode: normal; }
.seg.done b, .seg.now b { color: var(--bg); }
.ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.prompter { flex: 1; margin: 22px 0 12px; display: flex; flex-direction: column; gap: 18px; }
.scene-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.scene-name { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 22px; color: var(--gold); margin: 0; }
.scene-left { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.script { font-size: clamp(26px, 7vw, 34px); line-height: 1.38; font-weight: 600; margin: 0; }
.script span { color: var(--unspoken); transition: none; }
.script span.said { color: var(--spoken); }
.script span.now { color: var(--gold); }
.cue { margin: 0; font-size: 16px; line-height: 1.4; color: var(--muted); border-left: 3px solid var(--gold); padding: 4px 0 4px 12px; }
.cue.hot { color: var(--ink); }
.next { margin: 0; font-size: 17px; line-height: 1.45; color: var(--muted); }
.next strong { font-weight: 600; color: var(--muted); }

.count { position: fixed; inset: 0; display: none; place-items: center; background: color-mix(in srgb, var(--bg) 82%, transparent); z-index: 5; }
.count.on { display: grid; }
.count span { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 180px; color: var(--gold); }

.msg { margin: 0 0 12px; font-size: 15px; line-height: 1.45; padding: 12px 14px; border-radius: 12px; background: var(--gold-soft); color: var(--ink); display: none; }
.msg.on { display: block; }

.controls { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid var(--line); }
button { font: inherit; font-size: 17px; font-weight: 700; border-radius: 14px; padding: 16px 12px; border: 2px solid var(--gold); background: transparent; color: var(--ink); cursor: pointer; min-height: 56px; }
button.primary { background: var(--gold); color: var(--bg); }
button.danger { border-color: var(--rec); background: var(--rec); color: #FFFFFF; }
button[hidden] { display: none; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.wide { grid-column: 1 / -1; }
.take { grid-column: 1 / -1; font-size: 14px; color: var(--muted); margin: 0; text-align: center; }
.mic { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.mic label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.mic select { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.meter { flex: 1; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; position: relative; }
.meter i { position: absolute; inset: 0; background: var(--gold); transform-origin: 0 50%; transform: scaleX(0); }
.meter.hot i { background: var(--rec); }
.fallback { grid-column: 1 / -1; text-align: center; font-size: 15px; font-weight: 700; color: var(--gold); }
.fallback[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .count span { font-size: 120px; } }
</style>
</head>
<body>
<div class="app">
  <header class="clock">
    <div class="time" id="time">0:00<small>/ 0:55</small></div>
    <div class="state" id="state">Ready</div>
  </header>
  <div class="track" id="track" aria-hidden="true"></div>
  <div class="ticks" aria-hidden="true"><span>0:00</span><span>0:17</span><span>0:37</span><span>0:55</span></div>

  <section class="prompter" aria-live="polite">
    <div class="scene-head">
      <p class="scene-name" id="sceneName"></p>
      <span class="scene-left" id="sceneLeft"></span>
    </div>
    <p class="script" id="script"></p>
    <p class="cue" id="cue"></p>
    <p class="next" id="next"></p>
  </section>

  <p class="msg" id="msg"></p>

  <div class="controls">
    <button class="primary" id="btnRec">Record take</button>
    <button id="btnPractice">Practice run</button>
    <button class="danger wide" id="btnStop" hidden>Stop</button>
    <button id="btnPlay" hidden>Play take</button>
    <button class="primary" id="btnSave" hidden>Save audio file</button>
    <a class="fallback" id="saveLink" hidden>Tap here to download the file</a>
    <p class="take" id="takeInfo" hidden></p>
    <div class="mic">
      <label for="boost">Mic boost
        <select id="boost">
          <option value="1">Low</option>
          <option value="2" selected>Medium</option>
          <option value="3.5">High</option>
          <option value="6">Max</option>
        </select>
      </label>
      <div class="meter" id="meter" title="Mic level: aim for the bar to reach about 3/4 when you speak"><i></i></div>
    </div>
  </div>
</div>
<div class="count" id="count" aria-live="assertive"><span id="countNum">3</span></div>

<script>
const TOTAL = 55;
const SCENES = [
  { name: 'The challenge', start: 0, end: 7,
    text: 'Imagine you have ten thousand dollars to launch your first startup. Every decision matters. One wrong move, and your money could disappear.',
    cues: [[0, 'Gold light opens on the desk.'], [3, 'The $10,000 counter rises now.']] },
  { name: 'First decision', start: 7, end: 17,
    text: 'Your first decision. Spend seven thousand dollars building an AI app, or just one thousand launching an AI service? Think carefully. What would you choose?',
    cues: [[7, 'The two doors rise.'], [10, '“What would you choose?” appears. Pause after “Think carefully.”']] },
  { name: 'The expensive path', start: 17, end: 27,
    text: 'You choose the app. Seven thousand dollars later, it’s finally ready. The design looks amazing. The technology works. But there’s one problem. Nobody is paying for it.',
    cues: [[17, 'Door A opens on the founder.'], [20, 'The −$7,000 line appears.'], [23, '“Paying customers: 0” appears.']] },
  { name: 'The competitor', start: 27, end: 37,
    text: 'Meanwhile, another founder starts smaller. They talk to customers first, launch a simple service, and land three paying clients. Same market. Different approach.',
    cues: [[27, 'Split screen: the two founders.'], [30, 'Client icons pop in at 0:30, 0:31 and 0:32.']] },
  { name: 'The final chance', start: 37, end: 46,
    text: 'But you’re not finished yet. You still have three thousand dollars. Do you spend it on advertising, talk to customers, or pivot your product?',
    cues: [[37, '“Cash left: $3,000”.'], [39, '“One decision left.” fades in.'], [40, 'Options A, B, C appear at 0:40, 0:41, 0:42.']] },
  { name: 'Cliffhanger', start: 46, end: 55,
    text: 'Your startup’s future depends on your next move. A, B, or C? Comment your decision, and follow to see what happens next.',
    cues: [[46, 'The founder reaches for an option.'], [47.5, 'The screen freezes.'], [49, '“Comment A, B, or C” appears.'], [51, 'End screen. Finish your last line here.']] },
];
// spread each scene's words across its time so the highlight shows the pace that fits the clip
SCENES.forEach(s => {
  s.words = s.text.split(' ');
  const a = s.start + 0.25, b = s.end - 0.7;
  s.wordT = s.words.map((w, i) => a + (b - a) * i / s.words.length);
});

const $ = id => document.getElementById(id);
const els = { time: $('time'), state: $('state'), track: $('track'), sceneName: $('sceneName'), sceneLeft: $('sceneLeft'),
  script: $('script'), cue: $('cue'), next: $('next'), msg: $('msg'), count: $('count'), countNum: $('countNum'),
  rec: $('btnRec'), practice: $('btnPractice'), stop: $('btnStop'), play: $('btnPlay'), save: $('btnSave'), takeInfo: $('takeInfo'),
  boost: $('boost'), meter: $('meter') };

// timeline segments
const segFills = SCENES.map((s, i) => {
  const d = document.createElement('div');
  d.className = 'seg'; d.style.setProperty('--d', s.end - s.start);
  d.innerHTML = '<i></i><b>' + (i + 1) + '</b>';
  els.track.appendChild(d);
  return { box: d, fill: d.querySelector('i') };
});

let shownScene = -1, wordSpans = [];
function fmt(t) { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }

function render(t) {
  t = Math.min(Math.max(t, 0), TOTAL);
  els.time.firstChild.nodeValue = fmt(t);
  let idx = SCENES.findIndex(s => t < s.end); if (idx < 0) idx = SCENES.length - 1;
  const s = SCENES[idx];
  segFills.forEach((g, i) => {
    const sc = SCENES[i], p = Math.min(1, Math.max(0, (t - sc.start) / (sc.end - sc.start)));
    g.fill.style.transform = 'scaleX(' + p + ')';
    g.box.classList.toggle('done', p >= 1); g.box.classList.toggle('now', i === idx && p > 0 && p < 1);
  });
  if (idx !== shownScene) {
    shownScene = idx;
    els.sceneName.textContent = (idx + 1) + '. ' + s.name + ' — ' + fmt(s.start);
    els.script.innerHTML = '';
    wordSpans = s.words.map(w => { const sp = document.createElement('span'); sp.textContent = w + ' '; els.script.appendChild(sp); return sp; });
    const n = SCENES[idx + 1];
    els.next.innerHTML = n ? '<strong>Next at ' + fmt(n.start) + ':</strong> ' : '';
    if (n) els.next.appendChild(document.createTextNode(n.text));
  }
  els.sceneLeft.textContent = (s.end - t).toFixed(1) + ' s left';
  let cur = -1; s.wordT.forEach((wt, i) => { if (t >= wt) cur = i; });
  wordSpans.forEach((sp, i) => { sp.className = i < cur ? 'said' : i === cur ? 'now' : ''; });
  let cue = s.cues[0]; s.cues.forEach(c => { if (t >= c[0]) cue = c; });
  els.cue.textContent = fmt(cue[0]) + ' · ' + cue[1];
  els.cue.classList.toggle('hot', t - cue[0] < 1.2 && t >= cue[0] && running);
}

// ---- run loop ----
let running = false, mode = null, t0 = 0, raf = 0, clockFn = null;
function loop() {
  const t = clockFn();
  render(t);
  if (t >= TOTAL) { finish(); return; }
  raf = requestAnimationFrame(loop);
}
function setState(text, rec) { els.state.textContent = text; els.state.classList.toggle('rec', !!rec); }
function showMsg(text) { els.msg.textContent = text; els.msg.classList.toggle('on', !!text); }
function setButtons(phase) {
  const busy = phase === 'running' || phase === 'count';
  els.rec.hidden = busy; els.practice.hidden = busy; els.stop.hidden = phase !== 'running';
  els.play.hidden = busy || !take; els.save.hidden = busy || !take; els.takeInfo.hidden = busy || !take;
  if (busy || !take) $('saveLink').hidden = true;
  els.rec.textContent = take ? 'Record again' : 'Record take';
}

function countdown() {
  return new Promise(res => {
    let n = 3; els.count.classList.add('on'); els.countNum.textContent = n; setButtons('count');
    const iv = setInterval(() => { n--; if (n <= 0) { clearInterval(iv); els.count.classList.remove('on'); res(); } else els.countNum.textContent = n; }, 1000);
  });
}

function startClock(fromNow) { t0 = performance.now(); clockFn = fromNow || (() => (performance.now() - t0) / 1000); running = true; shownScene = -1; raf = requestAnimationFrame(loop); }

// ---- practice ----
els.practice.addEventListener('click', async () => {
  showMsg(''); mode = 'practice'; await countdown();
  setState('Practice'); setButtons('running'); startClock();
});

// ---- recording ----
let stream = null, recorder = null, chunks = [], take = null, takeExt = 'webm', takeUrl = null;
function pickType() {
  if (typeof MediaRecorder === 'undefined') return null;
  const opts = [['audio/webm;codecs=opus', 'webm'], ['audio/webm', 'webm'], ['audio/mp4', 'mp4'], ['audio/mp4;codecs=mp4a.40.2', 'mp4']];
  for (const [m, e] of opts) if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return [m, e];
  return ['', 'webm'];
}

// The phone's own noise suppression and auto-gain make voices quiet and muffled, so take the clean mic
// signal and do the processing here: cut rumble, boost, even out loud and soft words, and stop clipping.
let actx = null, boostNode = null, analyser = null, procStream = null, meterRaf = 0;
async function openMic() {
  if (!stream) {
    const want = { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1, sampleRate: 48000 };
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: want }); }
    catch (e) { if (e && e.name === 'NotAllowedError') throw e; stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return stream;
  if (!actx) {
    try { actx = new AC({ sampleRate: 48000 }); } catch (e) { actx = new AC(); }
    const src = actx.createMediaStreamSource(stream);
    const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 80; hp.Q.value = 0.7;
    const presence = actx.createBiquadFilter(); presence.type = 'peaking'; presence.frequency.value = 3500; presence.Q.value = 0.9; presence.gain.value = 3;
    boostNode = actx.createGain(); boostNode.gain.value = Number(els.boost.value);
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -26; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    const makeup = actx.createGain(); makeup.gain.value = 2;
    const limiter = actx.createDynamicsCompressor();
    limiter.threshold.value = -2; limiter.knee.value = 0; limiter.ratio.value = 20; limiter.attack.value = 0.001; limiter.release.value = 0.08;
    analyser = actx.createAnalyser(); analyser.fftSize = 1024;
    const dest = actx.createMediaStreamDestination(); dest.channelCount = 1;
    src.connect(hp); hp.connect(presence); presence.connect(boostNode); boostNode.connect(comp);
    comp.connect(makeup); makeup.connect(limiter); limiter.connect(dest); limiter.connect(analyser);
    procStream = dest.stream;
    startMeter();
  }
  if (actx.state !== 'running') { try { await actx.resume(); } catch (e) {} }
  return procStream || stream;
}
function startMeter() {
  const buf = new Float32Array(analyser.fftSize), bar = els.meter.firstElementChild;
  let shown = 0;
  const tick = () => {
    analyser.getFloatTimeDomainData(buf);
    let peak = 0; for (let i = 0; i < buf.length; i++) { const v = Math.abs(buf[i]); if (v > peak) peak = v; }
    shown = Math.max(peak, shown * 0.9);
    bar.style.transform = 'scaleX(' + Math.min(1, shown) + ')';
    els.meter.classList.toggle('hot', shown > 0.95);
    meterRaf = requestAnimationFrame(tick);
  };
  tick();
}
els.boost.addEventListener('change', () => { if (boostNode) boostNode.gain.setTargetAtTime(Number(els.boost.value), actx.currentTime, 0.05); });
els.rec.addEventListener('click', async () => {
  showMsg('');
  const type = pickType();
  if (!type || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showMsg('This view can’t record audio. Use Practice run while your phone’s voice recorder runs, then trim the start of that recording to the moment the timer hits 0:00.');
    return;
  }
  let recStream;
  try {
    recStream = await openMic();
  } catch (e) {
    showMsg('The microphone is blocked here (' + (e && e.name ? e.name : 'no access') + '). Allow microphone access for this page, or use Practice run with your phone’s voice recorder and trim to 0:00.');
    return;
  }
  await countdown();
  chunks = [];
  const recOpts = { audioBitsPerSecond: 192000 };
  if (type[0]) recOpts.mimeType = type[0];
  try { recorder = new MediaRecorder(recStream, recOpts); }
  catch (e) { recorder = type[0] ? new MediaRecorder(recStream, { mimeType: type[0] }) : new MediaRecorder(recStream); }
  takeExt = (recorder.mimeType || type[0]).includes('mp4') ? 'mp4' : 'webm';
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    take = new Blob(chunks, { type: recorder.mimeType || type[0] || 'audio/webm' });
    if (takeUrl) URL.revokeObjectURL(takeUrl);
    takeUrl = URL.createObjectURL(take);
    els.takeInfo.textContent = 'Take ready: ' + fmt(lastLen) + ', ' + (take.size / 1024 / 1024).toFixed(1) + ' MB. It starts exactly at 0:00 of the video.';
    setButtons('idle');
  };
  recorder.onstart = () => { mode = 'record'; setState('Recording', true); setButtons('running'); startClock(); };
  recorder.start(250);
});

let lastLen = 0;
function finish() {
  cancelAnimationFrame(raf); running = false;
  lastLen = clockFn ? Math.min(TOTAL, clockFn()) : 0;
  if (mode === 'record' && recorder && recorder.state !== 'inactive') { recorder.stop(); setState('Take saved'); }
  else if (mode === 'play') { player.pause(); setState('Ready'); setButtons('idle'); }
  else { setState('Ready'); setButtons('idle'); }
  render(lastLen); mode = null;
}
els.stop.addEventListener('click', finish);

// ---- playback, with the prompter following the audio ----
const player = new Audio();
els.play.addEventListener('click', async () => {
  if (!takeUrl) return;
  showMsg('');
  player.src = takeUrl; player.currentTime = 0;
  try { await player.play(); } catch (e) { showMsg('Playback isn’t available in this view. Save the file and play it on your phone instead.'); return; }
  mode = 'play'; setState('Playing'); setButtons('running');
  clockFn = () => player.currentTime; running = true; shownScene = -1; raf = requestAnimationFrame(loop);
});
player.addEventListener('ended', () => { if (mode === 'play') finish(); });

// ---- save ----
// claude.use() may not exist yet when this script first runs, so ask again at the moment of saving
let downloadsP = null;
function getDownloads() {
  if (!downloadsP) {
    const c = window.claude;
    if (!c || !c.use) return Promise.resolve(null);
    downloadsP = c.use('downloads').catch(() => null);
  }
  return downloadsP;
}
setTimeout(getDownloads, 0);

// when the in-page save isn't available, fall back to the phone's share sheet, then to a plain download link
async function fallbackSave(filename) {
  const file = new File([take], filename, { type: take.type || 'audio/' + takeExt });
  if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); showMsg('Choose “Save to Files” (iPhone) or your Drive/Files app. Then drop it at 0:00 of the video in CapCut or InShot.'); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = $('saveLink');
  a.href = takeUrl; a.download = filename; a.hidden = false;
  try { a.click(); } catch (e) {}
  showMsg('If the download didn’t start, tap the link above. On iPhone, open the page in Safari if it still won’t save.');
}

els.save.addEventListener('click', async () => {
  if (!take) return;
  const filename = 'startup-survival-ep1-voiceover.' + takeExt;
  const downloads = await getDownloads();
  if (!downloads) { fallbackSave(filename); return; }
  try {
    await downloads.save({ filename, data: take });
    showMsg('Saved. Drop it at 0:00 of the video in CapCut or InShot and it will line up.');
  } catch (e) {
    if (e && e.code === 'declined') return;
    if (e && e.code === 'rate_limited') { showMsg('A save window is already open. Finish that one, then tap Save again.'); return; }
    fallbackSave(filename);
  }
});

render(0); setButtons('idle');
</script>
</body>
</html>
